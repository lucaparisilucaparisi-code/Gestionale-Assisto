name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest + coverage, soglia minima 55%)
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=55

      - name: Test con i dati di Napoli (doppio giro, docs/ARCHITETTURA.md)
        run: pytest
        env:
          ASSISTO_TEST_CON_NAPOLI: "1"
